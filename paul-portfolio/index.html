<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paul Victor | Software Developer in Lagos</title>
    <meta
      name="description"
      content="Paul Mfonobong Victor is a software developer in Lagos, Nigeria, building responsive web applications with a growing focus on full-stack engineering, real-time systems and cloud technologies."
    />
    <meta name="theme-color" content="#17181b" />

    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apply the saved theme before first paint so the page never flashes the wrong colours. -->
    <script>
      try {
        var t = localStorage.getItem('pv-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript to run. Please enable it in your browser settings.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
